services:
  registry:
    image: goharbor/registry-photon:v2.12.0
    container_name: harbor-registry
    restart: always
    user: "0:0"
    volumes:
      - registry_data:/storage:z
      - ./common/config/registry/:/etc/registry/:z
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor

  registryctl:
    image: goharbor/harbor-registryctl:v2.12.0
    container_name: harbor-registryctl
    restart: always
    user: "0:0"
    env_file:
      - ./common/config/registryctl/env
    volumes:
      - registry_data:/storage:z
      - ./common/config/registry/:/etc/registry/:z
      - type: bind
        source: ./common/config/registryctl/config.yml
        target: /etc/registryctl/config.yml
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    environment:
      CORE_SECRET: ${HARBOR_CORE_SECRET}
      JOBSERVICE_SECRET: ${HARBOR_JOBSERVICE_SECRET}
    networks:
      - harbor

  postgresql:
    image: goharbor/harbor-db:v2.12.0
    container_name: harbor-db
    restart: always
    env_file:
      - ./common/config/db/env
    volumes:
      - db_data:/var/lib/postgresql/data:z
    environment:
      POSTGRES_PASSWORD: ${HARBOR_DB_PASSWORD}
    networks:
      - harbor

  redis:
    image: goharbor/redis-photon:v2.12.0
    container_name: harbor-redis
    restart: always
    volumes:
      - redis_data:/var/lib/redis
    networks:
      harbor:
        aliases:
          - redis

  core:
    image: goharbor/harbor-core:v2.12.0
    container_name: harbor-core
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2.0/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    env_file:
      - ./common/config/core/env
    volumes:
      - ca_download:/etc/core/ca/:z
      - harbor_data:/data/:z
      - ./common/config/core/app.conf:/etc/core/app.conf:z
      - type: bind
        source: ./certs/private_key.pem
        target: /etc/core/private_key.pem
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    environment:
      CORE_KEY: ${HARBOR_CORE_KEY}
      CORE_SECRET: ${HARBOR_CORE_SECRET}
      JOBSERVICE_SECRET: ${HARBOR_JOBSERVICE_SECRET}
      HARBOR_ADMIN_PASSWORD: ${HARBOR_ADMIN_PASSWORD}
      DATABASE_TYPE: postgresql
      POSTGRESQL_HOST: postgresql
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: registry
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: ${HARBOR_DB_PASSWORD}
      POSTGRESQL_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REGISTRY_URL: http://registry:5000
      TOKEN_SERVICE_URL: https://core/service/token
      HARBOR_URL: https://${HARBOR_HOSTNAME}
      EXT_ENDPOINT: https://${HARBOR_HOSTNAME}
      LOG_LEVEL: info
    networks:
      harbor:
        aliases:
          - harbor-core
    depends_on:
      - registry
      - redis
      - postgresql

  portal:
    image: goharbor/harbor-portal:v2.12.0
    container_name: harbor-portal
    restart: always
    volumes:
      - type: bind
        source: ./common/config/portal/nginx.conf
        target: /etc/nginx/nginx.conf
    networks:
      - harbor

  jobservice:
    image: goharbor/harbor-jobservice:v2.12.0
    container_name: harbor-jobservice
    restart: always
    env_file:
      - ./common/config/jobservice/env
    volumes:
      - job_logs:/var/log/jobs:z
      - type: bind
        source: ./common/config/jobservice/config.yml
        target: /etc/jobservice/config.yml
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    environment:
      CORE_SECRET: ${HARBOR_CORE_SECRET}
      JOBSERVICE_SECRET: ${HARBOR_JOBSERVICE_SECRET}
      CORE_URL: http://core:8080
      LOG_LEVEL: info
    networks:
      - harbor
    depends_on:
      - core

  proxy:
    image: goharbor/nginx-photon:v2.12.0
    container_name: harbor-proxy
    restart: always
    volumes:
      - ./common/config/nginx:/etc/nginx:z
      - type: bind
        source: ./certs/server.crt
        target: /etc/nginx/cert/server.crt
      - type: bind
        source: ./certs/server.key
        target: /etc/nginx/cert/server.key
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    ports:
      - "443:8443"
    networks:
      - harbor
    depends_on:
      - registry
      - core
      - portal

networks:
  harbor:
    driver: bridge

volumes:
  registry_data:
  db_data:
  redis_data:
  harbor_data:
  ca_download:
  job_logs: